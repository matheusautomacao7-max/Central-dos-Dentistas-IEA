services:
  postgres:
    image: postgres:16-alpine
    container_name: instituto-ayub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: instituto_ayub
      POSTGRES_USER: instituto_ayub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Cuiaba
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instituto_ayub -d instituto_ayub"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  instituto-ayub:
    build: .
    container_name: instituto-ayub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SESSION_SECURE: "1"
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_RELEASE_ID: ${APP_RELEASE_ID:-dev}
      WEBHOOK_PAYLOAD_RETENTION_DAYS: ${WEBHOOK_PAYLOAD_RETENTION_DAYS:-90}
      SECURITY_EVENT_RETENTION_DAYS: ${SECURITY_EVENT_RETENTION_DAYS:-365}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-12}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-8}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api-1myd-api-1:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      N8N_INTERNAL_URL: ${N8N_INTERNAL_URL:-http://n8n-czmx-n8n-1:5678}
      DATABASE_URL: postgresql://instituto_ayub:${POSTGRES_PASSWORD}@instituto-ayub-postgres:5432/instituto_ayub
      TZ: America/Cuiaba
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.instituto-ayub.rule=Host(`dentistas.automacaocentraliea.me`)"
      - "traefik.http.routers.instituto-ayub.entrypoints=websecure"
      - "traefik.http.routers.instituto-ayub.tls=true"
      - "traefik.http.routers.instituto-ayub.tls.certresolver=letsencrypt"
      - "traefik.http.services.instituto-ayub.loadbalancer.server.port=8000"
    volumes:
      - /opt/instituto-ayub/data/crm-media:/app/data/crm-media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - evolution
      - n8n

networks:
  evolution:
    external: true
    name: evolution-api-1myd_default
  n8n:
    external: true
    name: n8n-czmx_default

volumes:
  postgres_data:
