:{{ ct.color }}\"></span>{{ ct.label }}</div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"flex:1;overflow-y:auto\">\n        <sc-for list=\"{{ conversations }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.rowStyle }}\" style-hover=\"background:var(--hover)\">\n            <div style=\"{{ c.avatarStyle }}\">{{ c.initials }}</div>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n                <span style=\"font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.name }}</span>\n                <span style=\"{{ c.timeStyle }}\">{{ c.time }}</span>\n              </div>\n              <div style=\"display:flex;align-items:center;gap:6px;margin:3px 0\">\n                <span style=\"width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:{{ c.channelColor }}\"></span>\n                <span style=\"font-size:11px;color:var(--text3);font-weight:600;white-space:nowrap\">{{ c.channelName }}</span>\n              </div>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                <span style=\"font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1\">{{ c.snippet }}</span>\n                <sc-if value=\"{{ c.unread }}\"><span style=\"background:#25d366;color:#fff;font-size:11px;font-weight:800;border-radius:11px;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto\">{{ c.unread }}</span></sc-if>\n              </div>\n              <div style=\"display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center\">\n                <span style=\"{{ c.prioStyle }}\">{{ c.prioLabel }}</span>\n                <sc-if value=\"{{ c.snoozed }}\"><span style=\"display:flex;align-items n            <span>{{ activeConv.channelName }}</span><span>·</span><span>{{ activeConv.phone }}</span><span>·</span><span style=\"color:#25d366;font-weight:700\">{{ activeConv.owner }}</span>\n          </div>\n        </div>\n        <div style=\"display:flex;align-items:center;gap:5px;flex:0 0 auto\">\n          <sc-if value=\"{{ activeConv.canStart }}\"><button sc-camel-on-click=\"{{ startAttendance }}\" style=\"background:#25d366;border:none;border-radius:9px;padding:9px 14px;color:#fff;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer\">Iniciar atendimento</button></sc-if>\n          <button sc-camel-on-click=\"{{ openSchedule }}\" title=\"Adiar\" style=\"{{ iconBtn }}\" style-hover=\"background:var(--hover)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M12 6v6l4 2\"></path></svg></button>\n          <button sc-camel-on-click=\"{{ openTransfer }}\" title=\"Transferir\" style=\"{{ iconBtn }}\" style-hover=\"background:var(--hover)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3 4 7l4 4\"></path><path d=\"M4 7h16\"></path><path d=\"M16 21l4-4-4-4\"></path><path d=\"M20 17H4\"></path></svg></button>\n          <button sc-camel-on-click=\"{{ resolveConv }}\" style=\"{{ resolveBtn }}\" style-hover=\"background:#1da851\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"></path></svg><span>Resolver</span></button>\n          <button sc-camel-on-click=\"{{ toggleContext }}\" title=\"Detalhes\" style=\"width:38px;height:38px;border:none;border-radius:9px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);flex:0 0 auto\" style-hover=\"background:var(--hover)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"5\" r=\"1.6\"></circle><circle cx=\"12\" cy=\"12\" r=\"1.6\"></circle><circle cx=\"12\" cy=\"19\" r=\"1.6\"></circle></svg></button>\n        </div>\n      </header>\n\n      <div id=\"crmMessageViewport\" style=\"flex:1;overflow-y:auto;padding:22px 44px;display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <sc-if value=\"{{ m.showDate }}\"><div style=\"align-self:center;background:var(--panel);color:var(--text2);font-size:11.5px;font-weight:700;padding:6px 14px;border-radius:14px;box-shadow:0 1px 1px rgba(0,0,0,.05);margin:4px 0\">{{ m.dateLabel }}</div></sc-if>\n          <div style=\"{{ m.rowStyle }}\">\n            <div style=\"{{ m.bubbleStyle }}\">\n              <sc-if value=\"{{ m.showSender }}\"><div style=\"font-size:11px;font-weight:800;color:#4a9eff;margin-bottom:3px\">{{ m.sender }}</div></sc-if>\n              <sc-if value=\"{{ m.isText }}\"><span style=\"font-size:14px;line-height:1.4;white-space:pre-wrap\">{{ m.text }}</span></sc-if>\n              <sc-if value=\"{{ m.isSystem }}\"><span>{{ m.text }}</span></sc-if>\n              <sc-if value=\"{{ m.hasPlayableAudio }}\"><audio controls preload=\"metadata\" src=\"{{ m.audioUrl }}\" style=\"display:block;width:270px;max-width:100%;height:40px\">Seu navegador não conseguiu reproduzir este áudio.</audio></sc-if>\n              <sc-if value=\"{{ m.missingAudio }}\"><div style=\"font-size:12px;color:var(--text2);font-weight:700\">Áudio indisponível</div></sc-if>\n              <!-- CRM_NATIVE_AUDIO_STABLE_V10 -->\n              <sc-if value=\"{{ m.isImage }}\">\n                <a href=\"{{ m.mediaUrl }}\" target=\"_blank\" rel=\" onível</div></sc-if>\n              <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px\">\n                <span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">{{ m.time }}</span>\n                <sc-if value=\"{{ m.showTicks }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#53bdeb\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1.5 12.5 6 17 15 6\"></path><path d=\"m9 15 1 1 8.5-10\"></path></svg></sc-if>\n              </div>\n            </div>\n          </div>\n        </sc-for>\n        <sc-if value=\"{{ activeConv.typing }}\">\n          <div style=\"display:flex;justify-content:flex-start\">\n            <div style=\"padding:12px 14px;border-radius:9px;border-top-left-radius:2px;background:var(--bubbleIn);box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;gap:4px;align-items:center\">\n              <span style=\"width:7px;height:7px;border-radius:50%;background:var(--text3);animation:typ 1.2s infinite\"></span>\n              <span style=\"width:7px;height:7px;border-radius:50%;background:var(--text3);animation:typ 1.2s infinite .2s\"></span>\n              <span style=\"width:7px;height:7px;border-radius:50%;background:var(--text3);animation:typ 1.2s infinite .4s\"></span>\n            </div>\n          </div>\n        </sc-if>\n      </div>\n\n      <div style=\"padding:10px 16px;background:var(--panel2);border-top:1px solid var(--line)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px\">\n          <div style=\"display:flex;gap:7px;overflow-x:auto\">\n            <sc-for list=\"{{ quickReplies }}\" as=\"q\">\n              <span sc-camel-on-click=\"{{ q.pick }}\" style=\"display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--text2);white-space:nowrap;cursor:pointer;flex:0 0 auto\" style-hover=\"border-color:#25d366;color:#25d366\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#25d366\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 3 14h9l-1 8 10-12h-9z\"></path></svg>{{ q.text }}</span>\n            </sc-for>\n          </div>\n          <button sc-camel-on-click=\"{{ openQuick }}\" style=\"display:flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;padding-left:8px\" style-hover=\"color:#25d366\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"></path></svg>Gerenciar</button>\n        </div>\n        <sc-if value=\"{{ composerLocked }}\"><div style=\"display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:12px 16px;color:#a76b00;font-size:13px;font-weight:800\">🔒 {{ composerLockText }}</div></sc-if>\n        <sc-if value=\"{{ composerUnlocked }}\"><div style=\"display:flex;align-items:flex-end;gap:8px\">\n          <div style=\"position:relative;flex:0 0 auto\">\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleEmojiPicker }}\" style=\"{{ composerIcon }}\" style-hover=\"background:var(--hover)\" title=\"Emoji\" aria-label=\"Abrir seletor de emoji\" aria-expanded=\"{{ emojiPickerOpen }}\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M8 14s1.5 2 4 2 4-2 4-2\"></path><line x1=\"9\" y1=\"9\" x2=\"9.01\" y2=\"9\"></line><line x1=\"15\" y1=\"9\" x2=\"15.01\" y2=\"9\"></line></svg></button>\n            <sc-if value=\"{{ emojiPickerOpen }}\">\n              <div role=\"dialog\" aria-label=\"Selecionar emoji\" style=\"position:absolute;left:0;bottom:52px;width:286px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);z-index:30\">\n                <div style=\"font-size:12px;font-weight:800;color:var(--text2);margin:0 0 9px 2px\">Escolha um emoji</div>\n                <div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:4px\">\n                  <sc-for list=\"{{ emojiOptions }}\" as=\"emoji\"><button type=\"button\" sc-camel-on-click=\"{{ emoji.onClick }}\" aria-label=\"Inserir {{ emoji.label }}\" style=\"width:30px;height:30px;border:none;border-radius:7px;background:transparent;cursor:pointer;font-size:19px;line-height:1\" style-hover=\"background:var(--hover)\">{{ emoji.label }}</button></sc-for>\n                </div>\n              </div>\n            </sc-if>\n          </div>\n          <button type=\"button\" sc-camel-on-click=\"{{ openAttachmentPicker }}\" style=\"{{ composerIcon }}\" style-hover=\"background:var(--hover)\" title=\"Anexar imagem, vídeo ou arquivo\" aria-label=\"Anexar imagem, vídeo ou arquivo\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"></path></svg></button>\n          <input id=\"crmAttachmentInput\" type=\"file\" accept=\"image/jpeg,image/png,image/webp,video/mp4,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip\" sc-camel-on-change=\"{{ onAttachmentSelected }}\" style=\"display:none\">\n          <sc-if value=\"{{ attachmentSending }}\"><span style=\"font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;padding-bottom:13px\">Enviando arquivo…</span></sc-if>\n          <input id=\"crmComposerInput\" value=\"{{ draft }}\" sc-camel-on-input=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ onDraftKey }}\" sc-camel-on-focus=\"{{ closeEmojiPicker }}\" placeholder=\"Digite uma mensagem\" style=\"flex:1;border:none;background:var(--panel);border-radius:22px;padding:12px 18px;outline:none;font-family:inherit;font-size:14px;color:var(--text)\">\n          <button sc-camel-on-click=\"{{ startAudioRecording }}\" style=\"{{ audioRecordButton }}\" title=\"Gravar áudio\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"></rect><path d=\"M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8\"></path></svg></button>\n          <button sc-camel-on-click=\"{{ sendMsg }}\" style=\"width:46px;height:46px;border:none;border-radius:50%;background:#25d366;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(37,211,102,.4);flex:0 0 auto\" style-hover=\"background:#1da851\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13\"></path><path d=\"M22 2 15 22 11 13 2 9 22 2Z\"></path></svg></button>\n        </div></sc-if>\n        <sc-if value=\"{{ recordingAudio }}\"><div style=\"display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid rgba(239,68,68,.35);border-radius:24px;padding:6px 8px 6px 12px;min-height:48px\">\n          <button sc-camel-on-click=\"{{ cancelAudioRecording }}\" style=\"width:36px;height:36px;border:0;border-radius:50%;background:rgba(239,68,68,.10);color:#ef4444;display:grid;place-items:center;cursor:pointer\" title=\"Cancelar gravação\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6\"></path></svg></button>\n          <span style=\"width:9px;height:9px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite\"></span><span style=\"font-variant-numeric:tabular-nums;font-size:14px;font-weight:800;color:#ef4444\">{{ audioTime }}</span>\n          <div style=\"flex:1;display:flex;align-items:center;gap:4px;height:28px;overflow:hidden\"><sc-for list=\"{{ recordingWave }}\" as=\"bar\"><span style=\"width:3px;height:{{ bar }};border-radius:3px;background:#ef4444;opacity:.7;animation:pulse 1.1s infinite\"></span></sc-for></div>\n          <button sc-camel-on-click=\"{{ sendAudioRecording }}\" style=\"width:40px;height:40px;border:0;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(37,211,102,.35)\" title=\"Enviar áudio\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z\"></path></svg></button>\n        </div></sc-if>\n        <sc-if value=\"{{ audioSending }}\"><div style=\"display:flex;align-items:center;justify-content:center;gap:9px;color:var(--text2);font-size:13px;font-weight:700;padding:12px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#25d366;animation:pulse 1s infinite\"></span>Enviando áudio…</div></sc-if>\n      </div>\n    </section>\n\n    <sc-if value=\"{{ showContext }}\">\n    <aside style=\"width:330px;flex:0 0 330px;min-width:330px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto\">\n      <div style=\"padding:26px 22px;text-align:center;border-bottom:1px solid var(--line2)\">\n        <div style=\"display:flex;justify-content:center;width:100%\"><div style=\"{{ activeConv.bigAvatarStyle }}\">{{ activeConv.initials }}</div></div><!-- CRM_INTERNAL_TEAM_FILTER_V14 -->\n        <h2 style=\"margin:14px 0 2px;font-size:18px;font-weight:800\">{{ activeConv.name }}</h2>\n        <p style=\"margin:0;color:var(--text2);font-size:13px;font-weight:600\">{{ activeConv.phone }}</p>\n        <p style=\"margin:4px 0 0;color:var(--text3);font-size:12px\">{{ activeConv.company }}</p>\n      </div>\n      <div style=\"padding:18px 22px;border-bottom:1px solid var(--line2)\">\n        <div style=\"font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;margin-bottom:10px\">FUNIL DE VENDAS</div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.35);border-radius:10px;padding:11px 13px\">\n          <span style=\"font-weight:700;font-size:14px;color:#15a34a\">{{ activeConv.stage }}</span>\n          <span style=\"font-size:12px;color:var(--text2);font-weight:600\">{{ activeConv.owner }}</span>\n        </div>\n      </div>\n      <div style=\"padding:18px 22px;border-bottom:1px solid var(--line2)\">\n        <div style=\"font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;margin-bottom:10px\">ETIQUETAS</div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{ activeConv.tags }}\" as=\"t\"><span sc-camel-on-click=\"{{ t.onRemove }}\" title=\"Clique para remover\" style=\"{{ t.style }}\">{{ t.label }} ×</span></sc-for>\n          <span sc-camel-on-click=\"{{ addTag }}\" style=\"border:1px dashed var(--line);color:var(--text3);border-radius:6px;font-size:12px;font-weight:700;padding:3px 9px;cursor:pointer\">+ Adicionar</span>\n        </div>\n      </div>\n      <div style=\"padding:18px 22px;border-bottom:1px solid var(--line2)\">\n        <div style=\"font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;margin-bottom:10px\">TIPO DE CONTATO</div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px\">\n          <div><div style=\"font-size:13px;font-weight:800\">Contato interno da clínica</div><div style=\"font-size:11px;color:var(--text3);margin-top:3px;line-height:1.35\">Permite responder sem iniciar atendimento.</div></div>\n          <div title=\"Marcar ou desmarcar contato interno\" sc-camel-on-click=\"{{ toggleInternal }}\" style=\"{{ activeConv.internalSwitchStyle }}\"><span style=\"{{ activeConv.internalKnobStyle }}\"></span></div>\n        </div>\n      </div>\n      <div style=\"padding:18px 22px;border-bottom:1px solid var(--line2)\">\n        <div style=\"font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;margin-bottom:10px\">NOTA INTERNA</div>\n        <div style=\"background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:12px;font-size:13px;color:#b57e12;line-height:1.5\">{{ activeConv.note }}</div>\n      </div>\n      <div style=\"padding:18px 22px\">\n        <div style=\"font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;margin-bottom:12px\">HISTÓRICO DO CLIENTE</div>\n        <sc-for list=\"{{ activeConv.history }}\" as=\"h\">\n          <div style=\"display:flex;gap:11px;padding-bottom:15px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center\">\n              <span style=\"width:10px;height:10px;border-radius:50%;background:{{ h.color }};flex:0 0 auto;margin-top:3px\"></span>\n              <span style=\"width:2px;flex:1;background:var(--line)\"></span>\n            </div>\n            <div style=\"flex:1\">\n              <div style=\"font-size:13px;font-weight:700\">{{ h.title }}</div>\n              <div style=\"font-size:12px;color:var(--text3);margin-top:2px\">{{ h.date }}</div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </aside>\n    </sc-if>\n  </div>\n  </sc-if>\n\n  <!-- ============ FILAS ============ -->\n  <sc-if value=\"{{ isFilas }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px\">\n      <div>\n        <h1 style=\"margin:0;font-size:24px;font-weight:800\">Fila de atendimento</h1>\n        <p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">A equipe CRC define a prioridade clicando no selo · espera e SLA atualizados em tempo real</p>\n      </div>\n      <div style=\"display:flex;gap:10px\">\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-width:120px\"><div style=\"font-size:26px;font-weight:800;color:#ef4444\">{{ queueStats.waiting }}</div><div style=\"font-size:12px;color:var(--text2);font-weight:600\">Aguardando</div></div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-width:120px\"><div style=\"font-size:26px;font-weight:800;color:#15a34a\">{{ queueStats.active }}</div><div style=\"font-size:12px;color:var(--text2);font-weight:600\">Em atendimento</div></div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-width:120px\"><div style=\"font-size:26px;font-weight:800;color:var(--text)\">{{ queueStats.sla }}</div><div style=\"font-size:12px;color:var(--text2);font-weight:600\">SLA da fila</div></div>\n      </div>\n    </div>\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;gap:16px;padding:14px 22px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text3);letter-spacing:.3px\">\n        <span>CONTATO</span><span>CANAL / SETOR</span><span>PRIORIDADE</span><span>ESPERA</span><span>SLA</span><span></span>\n      </div>\n      <sc-for list=\"{{ queueItems }}\" as=\"q\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;gap:16px;padding:15px 22px;border-bottom:1px solid var(--line2);align-items:center\" style-hover=\"background:var(--hover)\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <div style=\"{{ q.avatarStyle }}\">{{ q.initials }}</div>\n            <div><div style=\"font-weight:700;font-size:14px\">{{ q.name }}</div><div style=\"font-size:12px;color:var(--text3)\">{{ q.snippet }}</div></div>\n          </div>\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ q.channelColor }}\"></span><span style=\"font-size:13px;font-weight:600;color:var(--text2)\">{{ q.channelName }}</span></div>\n          <div><button title=\"Clique para alterar a prioridade\" sc-camel-on-click=\"{{ q.onPriority }}\" style=\"{{ q.prioButtonStyle }}\">{{ q.prioLabel }} ▾</button></div>\n          <div style=\"font-size:14px;font-weight:700;color:var(--text2)\">{{ q.wait }}</div>\n          <div><span style=\"{{ q.slaStyle }}\">{{ q.sla }}</span></div>\n          <button sc-camel-on-click=\"{{ q.onAssign }}\" style=\"background:#25d366;color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap\" style-hover=\"background:#1da851\">Atender</button>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ FUNIL KANBAN ============ -->\n  <sc-if value=\"{{ isFunil }}\">\n  <div style=\"flex:1;overflow:hidden;display:flex;flex-direction:column;padding:28px 34px 0\">\n    <div style=\"margin-bottom:20px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:800\">Funil operacional</h1>\n      <p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">Visão automática do trabalho realizado no Inbox. Nenhuma movimentação manual é necessária.</p>\n    </div>\n    <div style=\"flex:1;display:flex;gap:16px;overflow-x:auto;padding-bottom:24px\">\n      <sc-for list=\"{{ funnelCols }}\" as=\"col\">\n        <div style=\"width:290px;flex:0 0 290px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:100%\">\n          <div style=\"padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)\">\n            <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ col.color }}\"></span><span style=\"font-weight:800;font-size:14px\">{{ col.label }}</span></div>\n            <span style=\"background:var(--chip);color:var(--chipT);font-size:12px;font-weight:800;border-radius:20px;padding:2px 9px\">{{ col.count }}</span>\n          </div>\n          <div style=\"flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ col.cards }}\" as=\"c\">\n              <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px\" style-hover=\"border-color:#25d366\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:9px\">\n                  <div style=\"{{ c.avatarStyle }}\">{{ c.initials }}</div>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-weight:700;font-size:13.5px\">{{ c.name }}</div><div style=\"font-size:11.5px;color:var(--text3)\">{{ c.company }}</div></div>\n                </div>\n                <div style=\"font-size:15px;font-weight:800;color:#15a34a;margin-bottom:8px\">{{ c.value }}</div>\n                <div style=\"display:flex;gap:5px;flex-wrap:wrap\"><sc-for list=\"{{ c.tags }}\" as=\"t\"><span style=\"{{ t.style }}\">{{ t.label }}</span></sc-for></div>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ GESTÃO / RELATÓRIOS ============ -->\n  <sc-if value=\"{{ isSuper }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px\">\n      <div><h1 style=\"margin:0;font-size:24px;font-weight:800\">Visão do gestor</h1><p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">Desempenho da operação · últimas 24h</p></div>\n      <div style=\"display:flex;gap:8px\">\n        <sc-raw-select style=\"{{ selectStyle }}\"><option>Últimas 24h</option><option>Últimos 7 dias</option><option>Este mês</option></sc-raw-select>\n        <sc-raw-select style=\"{{ selectStyle }}\"><option>Todos os canais</option><option>Vendas</option><option>Suporte</option><option>Financeiro</option></sc-raw-select>\n        <button style=\"{{ exportBtn }}\" style-hover=\"background:#1da851\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path><path d=\"M7 10l5 5 5-5\"></path><path d=\"M12 15V3\"></path></svg>Exportar</button>\n      </div>\n    </div>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\">\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px\">\n          <div style=\"font-size:12.5px;color:var(--text2);font-weight:700\">{{ k.label }}</div>\n          <div style=\"font-size:30px;font-weight:800;margin:8px 0 6px\">{{ k.value }}</div>\n          <div style=\"{{ k.deltaStyle }}\">{{ k.delta }}</div>\n        </div>\n      </sc-for>\n    </div>\n    <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px\">\n      <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px\"><h2 style=\"margin:0;font-size:16px;font-weight:800\">Volume de mensagens por hora</h2><span style=\"font-size:12px;color:var(--text3);font-weight:600\">recebidas</span></div>\n        <div style=\"display:flex;align-items:flex-end;gap:10px;height:200px\">\n          <sc-for list=\"{{ volumeBars }}\" as=\"b\"><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end\"><div style=\"width:100%;border-radius:6px 6px 0 0;background:linear-gradient(#25d366,#128c7e);height:{{ b.h }}\"></div><span style=\"font-size:11px;color:var(--text3);font-weight:600\">{{ b.label }}</span></div></sc-for>\n        </div>\n      </div>\n      <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n        <h2 style=\"margin:0 0 16px;font-size:16px;font-weight:800\">Atendentes online</h2>\n        <sc-for list=\"{{ agentRows }}\" as=\"a\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)\">\n            <div style=\"{{ a.avatarStyle }}\">{{ a.initials }}</div>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-weight:700;font-size:14px\">{{ a.name }}</div><div style=\"display:flex;align-items:center;gap:5px;margin-top:2px\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ a.statusColor }}\"></span><span style=\"font-size:12px;color:var(--text3);font-weight:600\">{{ a.status }}</span></div></div>\n            <div style=\"text-align:right\"><div style=\"font-size:15px;font-weight:800;color:#15a34a\">{{ a.active }}</div><div style=\"font-size:11px;color:var(--text3);font-weight:600\">ativos</div></div>\n            <div style=\"text-align:right;min-width:56px\"><div style=\"font-size:15px;font-weight:800\">{{ a.resolved }}</div><div style=\"font-size:11px;color:var(--text3);font-weight:600\">resolvidos</div></div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n      <div style=\"padding:16px 22px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800\">Relatório por atendente</div>\n      <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:16px;padding:12px 22px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text3)\">\n        <span>ATENDENTE</span><span>ATENDIDOS</span><span>RESOLVIDOS</span><span>T. MÉDIO</span><span>SATISFAÇÃO</span>\n      </div>\n      <sc-for list=\"{{ reportRows }}\" as=\"r\">\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line2);align-items:center\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"{{ r.avatarStyle }}\">{{ r.initials }}</div><span style=\"font-weight:700;font-size:14px\">{{ r.name }}</span></div>\n          <span style=\"font-size:14px;font-weight:700\">{{ r.handled }}</span>\n          <span style=\"font-size:14px;font-weight:700;color:#15a34a\">{{ r.resolved }}</span>\n          <span style=\"font-size:14px;font-weight:700\">{{ r.avg }}</span>\n          <span style=\"font-size:14px;font-weight:800;color:{{ r.satColor }}\">{{ r.sat }}</span>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ CONTATOS ============ -->\n  <sc-if value=\"{{ isContatos }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px\">\n      <div><h1 style=\"margin:0;font-size:24px;font-weight:800\">Contatos &amp; Leads</h1><p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">{{ contactsCount }} contatos · sincronizados dos canais de WhatsApp</p></div>\n      <button sc-camel-on-click=\"{{ openSearch }}\" style=\"background:#25d366;color:#fff;border:none;border-radius:10px;padding:11px 20px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer\" style-hover=\"background:#1da851\">+ Iniciar conversa</button>\n    </div>\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:2fr 1.25fr 1fr 1.25fr 1fr 145px;gap:16px;padding:14px 22px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text3);letter-spacing:.3px\">\n        <span>CONTATO</span><span>TELEFONE</span><span>ESTÁGIO</span><span>ETIQUETAS</span><span>RESPONSÁVEL</span><span>AÇÃO</span>\n      </div>\n      <sc-for list=\"{{ contacts }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:2fr 1.25fr 1fr 1.25fr 1fr 145px;gap:16px;padding:15px 22px;border-bottom:1px solid var(--line2);align-items:center\" style-hover=\"background:var(--hover)\">\n          <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"{{ c.avatarStyle }}\">{{ c.initials }}</div><div><div style=\"font-weight:700;font-size:14px\">{{ c.name }}</div><div style=\"font-size:12px;color:var(--text3)\">{{ c.company }}</div></div></div>\n          <div style=\"font-size:13.5px;color:var(--text2);font-weight:600\">{{ c.phone }}</div>\n          <div><span style=\"{{ c.stageStyle }}\">{{ c.stage }}</span></div>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap\"><sc-for list=\"{{ c.tags }}\" as=\"t\"><span style=\"{{ t.style }}\">{{ t.label }}</span></sc-for></div>\n          <div style=\"font-size:13px;color:var(--text2);font-weight:600\">{{ c.owner }}</div>\n          <button sc-camel-on-click=\"{{ c.onStart }}\" style=\"border:1px solid #25d366;background:rgba(37,211,102,.1);color:#159447;border-radius:8px;padding:8px 11px;font-weight:800;font-family:inherit;cursor:pointer\">Conversar</button>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ CAMPANHAS ============ -->\n  <sc-if value=\"{{ isCampanhas }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px\">\n      <div>\n        <h1 style=\"margin:0;font-size:24px;font-weight:800;color:var(--text)\">Campanhas &amp; Disparo em massa</h1>\n        <p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">Envie templates aprovados para listas segmentadas · via Evolution API</p>\n      </div>\n      <button sc-camel-on-click=\"{{ openCampaign }}\" style=\"display:flex;align-items:center;gap:7px;background:#25d366;color:#fff;border:none;border-radius:10px;padding:11px 20px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer\" style-hover=\"background:#1da851\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l19-9-9 19-2-8-8-2z\"></path></svg>Nova campanha</button>\n    </div>\n\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px\">\n      <sc-for list=\"{{ campaignKpis }}\" as=\"k\">\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px\">\n          <div style=\"font-size:12.5px;color:var(--text2);font-weight:700\">{{ k.label }}</div>\n          <div style=\"font-size:26px;font-weight:800;margin-top:6px;color:{{ k.color }}\">{{ k.value }}</div>\n        </div>\n      </sc-for>\n    </div>\n\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:1.8fr 1.1fr 1fr 1.4fr 1fr auto;gap:16px;padding:14px 22px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text2);letter-spacing:.3px\">\n        <span>CAMPANHA</span><span>PÚBLICO</span><span>CANAL</span><span>ENTREGA</span><span>STATUS</span><span></span>\n      </div>\n      <sc-for list=\"{{ campaigns }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:1.8fr 1.1fr 1fr 1.4fr 1fr auto;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);align-items:center\" style-hover=\"background:var(--hover)\">\n          <div>\n            <div style=\"font-weight:700;font-size:14px;color:var(--text)\">{{ c.name }}</div>\n            <div style=\"font-size:12px;color:var(--text2);margin-top:2px\">{{ c.template }}</div>\n          </div>\n          <div style=\"font-size:13.5px;color:var(--text);font-weight:600\">{{ c.audience }}</div>\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:{{ c.channelColor }}\"></span>\n            <span style=\"font-size:13px;font-weight:600;color:var(--text2)\">{{ c.channel }}</span>\n          </div>\n          <div>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:4px\"><span>{{ c.deliveredLabel }}</span><span>{{ c.pct }}</span></div>\n            <div style=\"height:6px;border-radius:6px;background:var(--input);overflow:hidden\"><div style=\"height:100%;border-radius:6px;background:{{ c.barColor }};width:{{ c.pct }}\"></div></div>\n          </div>\n          <div><span style=\"{{ c.statusStyle }}\">{{ c.status }}</span></div>\n          <button style=\"background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:700;font-size:12.5px;font-family:inherit;color:var(--text2);cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#25d366;color:#25d366\">{{ c.action }}</button>\n        </div>\n      </sc-for>\n    </div>\n\n    <h2 style=\"margin:26px 0 12px;font-size:15px;font-weight:800;color:var(--text2)\">Templates aprovados (HSM)</h2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n      <sc-for list=\"{{ templates }}\" as=\"t\">\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n            <span style=\"font-weight:800;font-size:14px;color:var(--text)\">{{ t.name }}</span>\n            <span style=\"background:#e7f7ee;color:#0b6b3f;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px\">APROVADO</span>\n          </div>\n          <p style=\"margin:0;font-size:13px;color:var(--text2);line-height:1.55;background:var(--input);border-radius:9px;padding:11px 12px\">{{ t.body }}</p>\n          <div style=\"font-size:11.5px;color:var(--text2);font-weight:600;margin-top:10px\">Categoria: {{ t.category }} · {{ t.lang }}</div>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ INTEGRAÇÕES ============ -->\n  <sc-if value=\"{{ isIntegra }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px\">\n      <div><h1 style=\"margin:0;font-size:24px;font-weight:800\">Integrações &amp; Canais</h1><p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">Conecte números de WhatsApp e automatize seu atendimento</p></div>\n      <button sc-camel-on-click=\"{{ openQr }}\" style=\"display:flex;align-items:center;gap:7px;background:#25d366;color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer\" style-hover=\"background:#1da851\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"></path></svg>Conectar número</button>\n    </div>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px\">\n      <div><h2 style=\"margin:0;font-size:17px;font-weight:800;color:var(--text)\">Números monitorados pelo CRM</h2><p style=\"margin:4px 0 0;color:var(--text2);font-size:13px\">Pausar aqui não desconecta o WhatsApp nem altera a Evolution.</p></div>\n      <button sc-camel-on-click=\"{{ syncChannels }}\" style=\"{{ primaryBtn }}\">Sincronizar canais ativos</button>\n    </div>\n    <sc-if value=\"{{ hasChannels }}\"><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:30px\">\n      <sc-for list=\"{{ channels }}\" as=\"ch\"><div style=\"{{ ch.cardStyle }}\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:14px\">\n          <div style=\"min-width:0\"><div style=\"font-weight:800;font-size:15px\">{{ ch.name }}</div><div style=\"font-size:12px;color:var(--text3);margin-top:3px\">{{ ch.phone }}</div></div>\n          <span style=\"{{ ch.statusStyle }};font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap\">{{ ch.status }}</span>\n        </div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)\">\n          <div><div style=\"font-size:12px;font-weight:800;{{ ch.syncStyle }}\">{{ ch.syncLabel }}</div><div style=\"font-size:11px;color:var(--text3);margin-top:2px\">Controla somente a entrada neste sistema</div></div>\n          <div sc-camel-on-click=\"{{ ch.onToggle }}\" style=\"{{ ch.switchStyle }}\"><div style=\"{{ ch.knobStyle }}\"></div></div>\n        </div>\n        <label style=\"display:block;margin-top:14px;font-size:11px;font-weight:800;color:var(--text3)\">SINCRONIZAR HISTÓRICO DESDE</label>\n        <input type=\"date\" value=\"{{ ch.fromDate }}\" sc-camel-on-change=\"{{ ch.onDate }}\" style=\"width:100%;margin-top:6px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:9px;padding:9px 11px;font:13px inherit\">\n      </div></sc-for>\n    </div></sc-if>\n    <sc-if value=\"{{ !hasChannels }}\"><div style=\"padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--text2);text-align:center;margin-bottom:30px\">Nenhum número foi localizado na Evolution.</div></sc-if>\n\n    <h2 style=\"margin:0 0 12px;font-size:15px;font-weight:800;color:var(--text2)\">Sincronização &amp; APIs</h2>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:30px\">\n      <sc-for list=\"{{ integrations }}\" as=\"ig\"><div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;gap:16px\">\n        <div style=\"width:52px;height:52px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;background:{{ ig.color }}\">{{ ig.badge }}</div>\n        <div style=\"flex:1;min-width:0\"><div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\"><span style=\"font-weight:800;font-size:16px\">{{ ig.name }}</span><span style=\"{{ ig.statusStyle }}\">{{ ig.status }}</span></div><p style=\"margin:6px 0 12px;font-size:13px;color:var(--text2);line-height:1.5\">{{ ig.desc }}</p><div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ig.meta }}</span><button sc-camel-on-click=\"{{ ig.onClick }}\" style=\"{{ ig.btnStyle }};white-space:nowrap\">{{ ig.btnLabel }}</button></div></div>\n      </div></sc-for>\n    </div>\n\n    <h2 style=\"margin:0 0 12px;font-size:15px;font-weight:800;color:var(--text2)\">Eventos &amp; automações (log)</h2>\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:auto 2fr 1fr 1fr;gap:16px;padding:12px 22px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text3)\">\n        <span style=\"min-width:64px\">HORÁRIO</span><span>EVENTO</span><span>ORIGEM</span><span>STATUS</span>\n      </div>\n      <sc-for list=\"{{ logs }}\" as=\"l\">\n        <div style=\"display:grid;grid-template-columns:auto 2fr 1fr 1fr;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line2);align-items:center\">\n          <span style=\"font-size:12.5px;color:var(--text3);font-family:monospace;min-width:64px\">{{ l.time }}</span>\n          <span style=\"font-size:13.5px;font-weight:600\">{{ l.event }}</span>\n          <span style=\"font-size:12.5px;font-weight:700;color:var(--text2)\">{{ l.source }}</span>\n          <span style=\"{{ l.statusStyle }}\">{{ l.status }}</span>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ CHATBOT BUILDER ============ -->\n  <sc-if value=\"{{ isChatbot }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n      <button sc-camel-on-click=\"{{ goIntegra }}\" style=\"background:transparent;border:none;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;font-family:inherit\" style-hover=\"color:#25d366\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M12 19l-7-7 7-7\"></path></svg>Integrações</button>\n    </div>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px\">\n      <div><h1 style=\"margin:0;font-size:24px;font-weight:800\">Construtor de fluxo · Chatbot IA</h1><p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">Triagem automática antes de encaminhar para um atendente humano</p></div>\n      <button style=\"{{ exportBtn }}\" style-hover=\"background:#1da851\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"></path></svg>Publicar fluxo</button>\n    </div>\n    <div style=\"display:grid;grid-template-columns:1.6fr 1fr;gap:20px\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:0\">\n        <sc-for list=\"{{ flowNodes }}\" as=\"n\">\n          <div style=\"width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-left:4px solid {{ n.color }};border-radius:12px;padding:16px 18px\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n              <span style=\"width:30px;height:30px;border-radius:9px;background:{{ n.tint }};color:{{ n.color }};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px\">{{ n.step }}</span>\n              <span style=\"font-weight:800;font-size:14.5px\">{{ n.title }}</span>\n              <span style=\"{{ n.tagStyle }}\">{{ n.tag }}</span>\n            </div>\n            <p style=\"margin:0;font-size:13px;color:var(--text2);line-height:1.5;padding-left:40px\">{{ n.desc }}</p>\n          </div>\n          <sc-if value=\"{{ n.arrow }}\"><div style=\"width:2px;height:22px;background:var(--line)\"></div></sc-if>\n        </sc-for>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px\">\n          <h3 style=\"margin:0 0 14px;font-size:15px;font-weight:800\">Horário de atendimento</h3>\n          <sc-for list=\"{{ botHours }}\" as=\"h\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2)\">\n              <span style=\"font-size:13.5px;font-weight:600\">{{ h.day }}</span>\n              <span style=\"font-size:13px;color:var(--text2);font-weight:700\">{{ h.hours }}</span>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px\">\n          <h3 style=\"margin:0 0 14px;font-size:15px;font-weight:800\">Comportamento</h3>\n          <sc-for list=\"{{ botToggles }}\" as=\"t\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0\">\n              <span style=\"font-size:13.5px;font-weight:600;max-width:180px\">{{ t.label }}</span>\n              <span style=\"{{ t.switchStyle }}\"><span style=\"{{ t.knobStyle }}\"></span></span>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ CONEXÃO DE DADOS ============ -->\n  <sc-if value=\"{{ isConexao }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n      <button sc-camel-on-click=\"{{ goIntegra }}\" style=\"background:transparent;border:none;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;font-family:inherit\" style-hover=\"color:#25d366\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M12 19l-7-7 7-7\"></path></svg>Integrações</button>\n    </div>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px\">\n      <div><h1 style=\"margin:0;font-size:24px;font-weight:800\">Conexão de dados</h1><p style=\"margin:6px 0 0;color:var(--text2);font-size:14px\">Endpoints, tokens e instâncias reais · Evolution API, n8n e Webhooks</p></div>\n      <button sc-camel-on-click=\"{{ testConn }}\" style=\"{{ exportBtn }}\" style-hover=\"background:#1da851\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"></path></svg>Testar conexões</button>\n    </div>\n\n    <sc-for list=\"{{ connCards }}\" as=\"cc\">\n      <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n          <div style=\"width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;background:{{ cc.color }}\">{{ cc.badge }}</div>\n          <div style=\"flex:1\"><div style=\"font-weight:800;font-size:16px;color:var(--text)\">{{ cc.name }}</div><div style=\"font-size:12.5px;color:var(--text2)\">{{ cc.subtitle }}</div></div>\n          <span style=\"{{ cc.statusStyle }}\">{{ cc.status }}</span>\n        </div>\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px\">\n          <sc-for list=\"{{ cc.fields }}\" as=\"f\">\n            <div style=\"{{ f.wrap }}\">\n              <div style=\"font-size:11px;font-weight:800;color:var(--text3);margin-bottom:6px;letter-spacing:.3px\">{{ f.label }}</div>\n              <div style=\"display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:0 12px\">\n                <input value=\"{{ f.value }}\" type=\"{{ f.type }}\" readonly=\"{{ f.readonly }}\" style=\"flex:1;border:none;background:transparent;color:var(--text);padding:11px 0;font-family:{{ f.font }};font-size:13px;font-weight:600;outline:none\">\n                <sc-if value=\"{{ f.copy }}\"><span style=\"font-size:11.5px;font-weight:800;color:#25d366;cursor:pointer;flex:0 0 auto\">COPIAR</span></sc-if>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </sc-for>\n  </div>\n  </sc-if>\n\n  <!-- ============ CONFIG ============ -->\n  <sc-if value=\"{{ isConfig }}\">\n  <div style=\"flex:1;overflow-y:auto;padding:28px 34px\">\n    <h1 style=\"margin:0 0 4px;font-size:24px;font-weight:800\">Configurações</h1>\n    <p style=\"margin:0 0 24px;color:var(--text2);font-size:14px\">Perfis, SLA, aparência e notificações</p>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start\">\n      <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n        <div style=\"padding:16px 22px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800\">Perfis &amp; permissões</div>\n        <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:12px 22px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text3)\">\n          <span>PERMISSÃO</span><span style=\"text-align:center\">Admin</span><span style=\"text-align:center\">Supervisor</span><span style=\"text-align:center\">Atendente</span>\n        </div>\n        <sc-for list=\"{{ perms }}\" as=\"p\">\n          <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line2);align-items:center\">\n            <span style=\"font-size:13.5px;font-weight:600\">{{ p.label }}</span>\n            <span style=\"text-align:center\">{{ p.admin }}</span>\n            <span style=\"text-align:center\">{{ p.sup }}</span>\n            <span style=\"text-align:center\">{{ p.at }}</span>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n          <h3 style=\"margin:0 0 14px;font-size:16px;font-weight:800\">SLA por prioridade</h3>\n          <sc-for list=\"{{ slaRows }}\" as=\"s\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)\">\n              <span style=\"{{ s.chipStyle }}\">{{ s.label }}</span>\n              <div style=\"display:flex;align-items:center;gap:8px\"><input value=\"{{ s.value }}\" style=\"width:56px;text-align:center;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:8px;padding:6px;font-family:inherit;font-weight:700;font-size:13px\"><span style=\"font-size:13px;color:var(--text2);font-weight:600\">min</span></div>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n          <h3 style=\"margin:0 0 6px;font-size:16px;font-weight:800\">Aparência</h3>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:11px 0\">\n            <span style=\"font-size:13.5px;font-weight:600\">Tema escuro</span>\n            <span sc-camel-on-click=\"{{ toggleTheme }}\" style=\"{{ themeSwitch }}\"><span style=\"{{ themeKnob }}\"></span></span>\n          </div>\n        </div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n          <h3 style=\"margin:0 0 6px;font-size:16px;font-weight:800\">Notificações</h3>\n          <sc-for list=\"{{ notifToggles }}\" as=\"t\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0\">\n              <span style=\"font-size:13.5px;font-weight:600\">{{ t.label }}</span>\n              <span style=\"{{ t.switchStyle }}\"><span style=\"{{ t.knobStyle }}\"></span></span>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n          <h3 style=\"margin:0 0 4px;font-size:16px;font-weight:800\">Marca (white-label)</h3>\n          <p style=\"margin:0 0 14px;font-size:12.5px;color:var(--text2)\">Personalize a plataforma com sua identidade</p>\n          <div style=\"font-size:11.5px;font-weight:800;color:var(--text3);margin-bottom:6px\">NOME DA PLATAFORMA</div>\n          <input value=\"{{ brandName }}\" sc-camel-on-input=\"{{ onBrandName }}\" style=\"width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;font-weight:700;outline:none;margin-bottom:14px\">\n          <div style=\"font-size:11.5px;font-weight:800;color:var(--text3);margin-bottom:8px\">COR PRIMÁRIA</div>\n          <div style=\"display:flex;gap:9px;margin-bottom:16px\">\n            <sc-for list=\"{{ brandColors }}\" as=\"bc\">\n              <span sc-camel-on-click=\"{{ bc.onClick }}\" style=\"{{ bc.style }}\"><sc-if value=\"{{ bc.active }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"></path></svg></sc-if></span>\n            </sc-for>\n          </div>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:10px\">\n            <div style=\"width:38px;height:38px;border-radius:9px;background:{{ brandColor }};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:0 0 auto\">{{ brandInitial }}</div>\n            <div><div style=\"font-size:13.5px;font-weight:800;color:var(--text)\">{{ brandName }}</div><div style=\"font-size:11.5px;color:var(--text2)\">Pré-visualização do logo</div></div>\n          </div>\n        </div>\n        <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px\">\n          <h3 style=\"margin:0 0 14px;font-size:16px;font-weight:800\">Idioma da interface</h3>\n          <sc-for list=\"{{ languages }}\" as=\"lg\">\n            <div sc-camel-on-click=\"{{ lg.onClick }}\" style=\"{{ lg.rowStyle }}\" style-hover=\"background:var(--hover)\">\n              <span style=\"font-size:20px\">{{ lg.flag }}</span>\n              <span style=\"flex:1;font-size:13.5px;font-weight:700;color:var(--text)\">{{ lg.label }}</span>\n              <sc-if value=\"{{ lg.active }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#25d366\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"></path></svg></sc-if>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ============ MODAIS ============ -->\n  <sc-if value=\"{{ modalTransfer }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"{{ overlay }}\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"{{ modalCard }}\">\n      <h2 style=\"margin:0 0 4px;font-size:19px;font-weight:800\">Transferir atendimento</h2>\n      <p style=\"margin:0 0 18px;color:var(--text2);font-size:13.5px\">Encaminhar {{ activeConv.name }} para outro atendente ou setor</p>\n      <div style=\"font-size:11.5px;font-weight:800;color:var(--text3);margin-bottom:8px\">ATENDENTE</div>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px\">\n        <sc-for list=\"{{ transferAgents }}\" as=\"a\">\n          <div sc-camel-on-click=\"{{ a.onClick }}\" style=\"{{ a.rowStyle }}\" style-hover=\"border-color:#25d366\">\n            <div style=\"{{ a.avatarStyle }}\">{{ a.initials }}</div>\n            <div style=\"flex:1\"><div style=\"font-weight:700;font-size:14px\">{{ a.name }}</div><div style=\"display:flex;align-items:center;gap:5px;margin-top:2px\"><span style=\"width:7px;height:7px;border-radius:50%;backgro
