<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificação de segurança | IEA</title><link rel="stylesheet" href="/styles.css"></head>
<body class="iea-login-page"><main class="two-factor-card"><img class="two-factor-logo" src="/assets/login/logo3d-new.png" alt="Instituto Eduardo Ayub"><p class="two-factor-eyebrow">VERIFICAÇÃO DE SEGURANÇA</p><h1>Digite o código do autenticador</h1><p>Abra o aplicativo autenticador e informe o código de 6 dígitos.</p><form id="twoFactorForm"><label>Código<input id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required autofocus></label><p class="auth-error" id="twoFactorError" hidden></p><button class="iea-login-submit" type="submit">Confirmar acesso</button></form><a class="iea-forgot" href="/login">Voltar ao login</a></main><script src="/two-factor.js"></script></body>
</html>
