<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ativar acesso | Instituto Eduardo Ayub</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/png" href="/assets/favicon-iea.png"></head>
<body class="auth-page"><main class="auth-card"><img class="auth-logo" src="/assets/logo-iea-transparent.png" alt="Instituto Eduardo Ayub"><p class="eyebrow">PRIMEIRO ACESSO</p><h1>Ative a conta proprietária.</h1><p>Crie uma senha exclusiva para a Dra. Dulce. No ambiente publicado, use também o código de ativação fornecido na implantação.</p><form id="setupForm"><label>Código de ativação (somente publicação)<input id="setupToken" type="password"></label><label>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirmar senha<input id="confirmation" type="password" autocomplete="new-password" minlength="10" required></label><p id="setupError" class="auth-error" hidden></p><button class="primary-button" type="submit">Ativar acesso</button></form><a class="auth-link" href="/login">Voltar ao login</a></main><script src="/login.js"></script></body></html>
