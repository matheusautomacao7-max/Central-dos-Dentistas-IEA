<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar proteção | IEA</title><link rel="stylesheet" href="/styles.css"></head>
<body class="iea-login-page"><main class="two-factor-card"><img class="two-factor-logo" src="/assets/login/logo3d-new.png" alt="Instituto Eduardo Ayub"><p class="two-factor-eyebrow">PROTEÇÃO OBRIGATÓRIA</p><h1>Ative a autenticação em duas etapas</h1><p>Abra Google Authenticator, Microsoft Authenticator ou Authy e escaneie este QR Code. Depois informe o primeiro código gerado.</p><div class="two-factor-qr"><img id="twoFactorQr" alt="QR Code para configurar o autenticador"></div><details class="two-factor-manual"><summary>Não consegue escanear? Usar chave manual</summary><strong id="twoFactorSecret">Carregando…</strong></details><form id="twoFactorSetupForm"><label>Código de 6 dígitos<input id="twoFactorSetupCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required></label><p class="auth-error" id="twoFactorSetupError" hidden></p><button class="iea-login-submit" type="submit">Ativar proteção</button></form></main><script src="/two-factor.js"></script></body>
</html>
